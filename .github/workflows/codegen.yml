# ---------------------------------------------------------------------------
# Daily codegen cycle for the hablla SDK.
#
# Regenerates the SDK from the live studio bundle + swagger, reads the outcome
# from generation-report.json and acts on it:
#
#   - additive | changed -> prepare release, verify, commit + tag + push to main
#   - breaking           -> prepare release, verify, update the single PR on
#                           codegen/breaking (human review, never auto-merged)
#   - failure | noop     -> change nothing
#
# Any failed step (install, pipeline guard, verification, release, PR) opens ONE
# issue labelled codegen+failure, or comments on the one already open. Releases
# and PRs only happen on main. Every text (CHANGELOG, PR body, issue) is rendered
# deterministically from the report by scripts/codegen-summary.mjs.
# ---------------------------------------------------------------------------
name: codegen

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codegen
  cancel-in-progress: false

env:
  REPORT: generation-report.json

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, tags included)
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Ensure labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create codegen --color 5319e7 --description "Automated codegen cycle" --force
          gh label create breaking --color b60205 --description "Breaking SDK change awaiting review" --force
          gh label create failure --color d93f0b --description "Codegen run failed" --force

      - name: Install dependencies (no lifecycle scripts)
        id: install
        run: npm ci --ignore-scripts

      - name: Build generator
        id: build-generator
        run: npm run build:gen

      - name: Run codegen pipeline
        id: pipeline
        continue-on-error: true
        run: node dist/generator/pipeline.js

      - name: Classify outcome
        id: classify
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: node scripts/codegen-summary.mjs outcome --report="$REPORT" --pipeline="$PIPELINE_OUTCOME" >> "$GITHUB_OUTPUT"

      - name: Upload generation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generation-report
          path: generation-report.json
          if-no-files-found: ignore

      - name: Prepare release (version, lock, CHANGELOG, bundles)
        id: prepare
        if: contains(fromJSON('["additive","changed","breaking"]'), steps.classify.outputs.outcome)
        run: node scripts/release.mjs prepare --report="$REPORT"

      - name: Verify generated SDK (typecheck, test, build:rpo, build:gas)
        id: verify
        if: steps.prepare.outcome == 'success'
        run: npm run verify

      - name: Publish release
        id: publish
        if: steps.verify.outcome == 'success' && github.ref == 'refs/heads/main' && steps.classify.outputs.outcome != 'breaking'
        run: node scripts/release.mjs publish --report="$REPORT"

      - name: Render breaking PR inputs
        id: pr-inputs
        if: steps.verify.outcome == 'success' && github.ref == 'refs/heads/main' && steps.classify.outputs.outcome == 'breaking'
        run: |
          node scripts/codegen-summary.mjs summary --report="$REPORT" --out="$RUNNER_TEMP/codegen-summary.md"
          {
            echo "version=$(node -p "require('./package.json').version")"
            echo "paths<<EOF_RELEASE_PATHS"
            node scripts/release.mjs paths
            echo "EOF_RELEASE_PATHS"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update breaking-change PR
        id: pull-request
        if: steps.pr-inputs.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codegen/breaking
          add-paths: ${{ steps.pr-inputs.outputs.paths }}
          commit-message: "feat(codegen)!: regen breaking, v${{ steps.pr-inputs.outputs.version }}"
          title: "Codegen: breaking API changes (v${{ steps.pr-inputs.outputs.version }})"
          body-path: ${{ runner.temp }}/codegen-summary.md
          reviewers: gabrielbarbosel
          labels: |
            codegen
            breaking
          delete-branch: true

      - name: Open or comment failure issue
        if: failure() || steps.classify.outputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="$RUNNER_TEMP/codegen-failure.md"
          node scripts/codegen-summary.mjs failure --report="$REPORT" --steps="$STEPS_JSON" --run-url="$RUN_URL" --out="$BODY"
          OPEN_ISSUE=$(gh issue list --label codegen --label failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body-file "$BODY"
          else
            gh issue create --title "Codegen: daily cycle failing" --body-file "$BODY" --assignee gabrielbarbosel --label codegen --label failure
          fi
